<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Legend of Chaat — Digital Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#2A1005;
    --base-dark:#1F120C;
    --base-dark-2:#2B180F;
    --card:#FFF8ED;
    --card-edge:#F1E2C8;
    --masala:#C1440E;
    --masala-deep:#8F2F09;
    --turmeric:#E8A93B;
    --turmeric-soft:#F3C876;
    --mint:#5C8A4A;
    --cream:#F7ECD9;
    --cream-dim:#E4D3B4;
    --tamarind:#6B3B2A;
    --card-title:#8F2F09;
    --card-text:#2A1005;
    --card-desc:#7A5B45;
    --shadow: 0 14px 30px -12px rgba(31,18,12,0.55);
  }
 
  /* ---------- THEME 2: Midnight Tandoor ---------- */
  body[data-theme="tandoor"]{
    --ink:#F3F0EC;
    --base-dark:#0D0D10;
    --base-dark-2:#1A1A1F;
    --card:#1E1B1F;
    --card-edge:#332E36;
    --masala:#FF5B3D;
    --masala-deep:#C43A1D;
    --turmeric:#FFC65C;
    --turmeric-soft:#FFDE9A;
    --mint:#33D6A6;
    --cream:#F3F0EC;
    --cream-dim:#B9B5B0;
    --tamarind:#8A5636;
    --card-title:#FFC65C;
    --card-text:#F3F0EC;
    --card-desc:#B9AFA6;
  }
 
  /* ---------- THEME 3: Royal Rajwada ---------- */
  body[data-theme="rajwada"]{
    --ink:#2A1005;
    --base-dark:#1A0A0E;
    --base-dark-2:#261016;
    --card:#FBF3E1;
    --card-edge:#E8D9B5;
    --masala:#8E1F3B;
    --masala-deep:#5C0F24;
    --turmeric:#D4AF6A;
    --turmeric-soft:#E8CE9A;
    --mint:#7A8F5C;
    --cream:#F5E9D0;
    --cream-dim:#D8C6A0;
    --tamarind:#6B3B2A;
    --card-title:#5C0F24;
    --card-text:#2A1005;
    --card-desc:#7A5B45;
  }
 
  /* ---------- THEME 4: Mint Bazaar ---------- */
  body[data-theme="mint"]{
    --ink:#0B2620;
    --base-dark:#08201C;
    --base-dark-2:#0F2F28;
    --card:#F2FBF8;
    --card-edge:#D6ECE4;
    --masala:#FF6F59;
    --masala-deep:#D6482F;
    --turmeric:#FFB84D;
    --turmeric-soft:#FFD08A;
    --mint:#2FBF9F;
    --cream:#EAF6F1;
    --cream-dim:#B7D8CE;
    --tamarind:#3E6B5A;
    --card-title:#0F5B4A;
    --card-text:#0B2620;
    --card-desc:#4B7A6C;
  }
 
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(232,169,59,0.10), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(193,68,14,0.14), transparent 45%),
      var(--base-dark);
    color:var(--cream);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
    transition: background .5s ease, color .5s ease;
  }
 
  /* ---------- decorative scattered seeds ---------- */
  .seedfield{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.35;
    background-image:
      radial-gradient(circle, var(--turmeric) 1.5px, transparent 1.6px),
      radial-gradient(circle, var(--masala) 1.5px, transparent 1.6px);
    background-size: 90px 90px, 130px 130px;
    background-position: 0 0, 40px 60px;
  }
 
  /* ---------- HERO ---------- */
  .hero{
    position:relative; z-index:1;
    padding: 44px 20px 30px;
    text-align:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:-40% -10% auto -10%; height:220px;
    background: conic-gradient(from 180deg, var(--masala), var(--turmeric), var(--mint), var(--masala));
    filter: blur(70px); opacity:0.28; z-index:-1;
  }
  .stamp{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:3px; text-transform:uppercase;
    color: var(--turmeric-soft);
    border:1px dashed rgba(232,169,59,0.55);
    padding:6px 14px; border-radius:100px;
    margin-bottom:18px;
  }
  .stamp span.dot{width:5px;height:5px;border-radius:50%;background:var(--masala);display:inline-block;}
  h1.brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(30px, 8vw, 54px);
    line-height:1.05;
    margin:0;
    letter-spacing:0.5px;
    color: var(--cream);
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  h1.brand .accent{
    color: var(--turmeric);
    position:relative;
  }
  .tagline{
    margin:14px auto 0;
    max-width:440px;
    font-size:14.5px;
    color: var(--cream-dim);
    line-height:1.6;
  }
  .tagline b{color:var(--turmeric-soft); font-weight:600;}
 
  .divider-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:22px 0 4px;
  }
  .divider-row .line{height:1px; width:36px; background:linear-gradient(90deg, transparent, rgba(232,169,59,0.6), transparent);}
  .divider-row .glyph{font-size:15px;}
 
  /* ---------- THEME PICKER ---------- */
  .theme-picker{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:20px; flex-wrap:wrap;
  }
  .theme-picker .tp-label{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--cream-dim); margin-right:2px;
  }
  .swatch{
    width:30px; height:30px; border-radius:50%;
    cursor:pointer; border:2px solid rgba(255,255,255,0.15);
    transition: transform .2s ease, border-color .2s ease;
    position:relative; flex:0 0 auto;
  }
  .swatch:hover{ transform: scale(1.12); }
  .swatch.active{ border-color:#fff; transform: scale(1.15); box-shadow:0 0 0 3px rgba(255,255,255,0.15); }
  .swatch[data-t="spice"]{ background: linear-gradient(135deg,#C1440E,#E8A93B); }
  .swatch[data-t="tandoor"]{ background: linear-gradient(135deg,#0D0D10,#FF5B3D); }
  .swatch[data-t="rajwada"]{ background: linear-gradient(135deg,#8E1F3B,#D4AF6A); }
  .swatch[data-t="mint"]{ background: linear-gradient(135deg,#08201C,#2FBF9F); }
 
  /* ---------- CART BUTTON ---------- */
  .cart-fab{
    position:fixed; right:18px; bottom:18px; z-index:40;
    width:60px; height:60px; border-radius:50%;
    background: linear-gradient(135deg, var(--masala), var(--masala-deep));
    display:flex; align-items:center; justify-content:center;
    font-size:24px; border:none; cursor:pointer; color:#fff;
    box-shadow: 0 14px 26px -8px rgba(0,0,0,0.5);
    transition: transform .2s ease;
  }
  .cart-fab:active{ transform: scale(0.9); }
  .cart-badge{
    position:absolute; top:-4px; right:-4px;
    background: var(--turmeric); color:#2A1005;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px;
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--base-dark);
  }
 
  /* ---------- ADD TO CART BUTTON ---------- */
  .card .bottom-row{
    display:flex; align-items:center; justify-content:space-between;
    border-top: 1px dashed var(--card-edge);
    padding-top:12px; gap:10px;
  }
  .add-cart-btn{
    display:flex; align-items:center; gap:6px;
    background: linear-gradient(135deg, var(--mint), #3E6B2E);
    color:#fff; border:none; border-radius:10px;
    font-family:'Poppins',sans-serif; font-weight:600; font-size:12px;
    padding: 8px 12px; cursor:pointer;
    transition: transform .15s ease, background .3s ease;
    box-shadow: 0 8px 16px -6px rgba(92,138,74,0.55);
  }
  .add-cart-btn:active{ transform: scale(0.92); }
  .add-cart-btn.added{ background: linear-gradient(135deg, var(--masala), var(--masala-deep)); }
 
  /* ---------- OVERLAY / SHEET ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:70;
    background: var(--base-dark-2);
    border-radius: 24px 24px 0 0;
    max-height:85vh; overflow-y:auto;
    padding: 20px 20px 26px;
    transform: translateY(110%);
    transition: transform .35s cubic-bezier(.2,.7,.3,1);
    box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
  }
  .sheet.show{ transform: translateY(0); }
  @media (min-width:700px){
    .sheet{ left:50%; right:auto; bottom:24px; width:440px; margin-left:-220px; border-radius:24px; max-height:80vh; }
    .sheet.show{ transform: translateY(0); }
  }
  .sheet-handle{ width:40px; height:4px; border-radius:4px; background:var(--card-edge); margin:0 auto 16px; }
  .sheet-title{
    font-family:'Baloo 2', sans-serif; font-size:22px; color:var(--cream);
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .sheet-close{ background:none; border:none; color:var(--cream-dim); font-size:20px; cursor:pointer; }
 
  .cart-line{
    display:flex; align-items:center; gap:12px;
    background: var(--card); border-radius:14px; padding:10px 12px; margin-bottom:10px;
    color: var(--card-text);
  }
  .cart-line .ci-ic{
    width:42px; height:42px; border-radius:11px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    background: linear-gradient(150deg, var(--iconA,#E8A93B), var(--iconB,#C1440E));
  }
  .cart-line .ci-info{ flex:1; min-width:0; }
  .cart-line .ci-info .ci-name{ font-weight:600; font-size:13.5px; color:var(--card-title); }
  .cart-line .ci-info .ci-price{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--card-desc); }
  .qty-stepper{ display:flex; align-items:center; gap:8px; }
  .qty-stepper button{
    width:26px; height:26px; border-radius:8px; border:none; cursor:pointer;
    background: var(--card-edge); color:var(--card-text); font-weight:700; font-size:14px;
  }
  .qty-stepper span{ font-family:'JetBrains Mono',monospace; font-weight:700; min-width:16px; text-align:center; }
 
  .cart-empty{ text-align:center; padding:30px 10px; color:var(--cream-dim); font-size:13.5px; }
 
  .cart-total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-top:1px dashed rgba(232,169,59,0.3); margin-top:6px;
  }
  .cart-total-row .lbl{ font-size:13px; color:var(--cream-dim); }
  .cart-total-row .amt{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; color:var(--turmeric-soft); }
 
  .primary-btn{
    width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--masala), var(--masala-deep)); color:#fff;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; margin-top:6px;
    transition: transform .15s ease;
  }
  .primary-btn:active{ transform: scale(0.97); }
  .primary-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .ghost-btn{
    width:100%; padding:12px; border-radius:14px; margin-top:8px;
    background:transparent; border:1px solid rgba(232,169,59,0.4); color:var(--cream);
    font-family:'Poppins',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;
  }
 
  .pay-options{ display:flex; gap:12px; margin:6px 0 4px; }
  .pay-opt{
    flex:1; padding:18px 10px; border-radius:16px; text-align:center; cursor:pointer;
    background: var(--card); border:2px solid var(--card-edge); color:var(--card-text);
    transition: border-color .2s ease, transform .2s ease;
  }
  .pay-opt:hover{ transform: translateY(-2px); }
  .pay-opt.sel{ border-color: var(--masala); }
  .pay-opt .pi{ font-size:26px; margin-bottom:6px; }
  .pay-opt .pn{ font-weight:600; font-size:13.5px; }
 
  .qr-box{
    background:#fff; border-radius:16px; padding:16px; display:flex; justify-content:center; margin:14px 0;
  }
  .upi-note{
    font-size:12px; color:var(--cream-dim); text-align:center; line-height:1.6; margin-bottom:6px;
  }
  .upi-note code{ color:var(--turmeric-soft); }
  .order-conf{ text-align:center; padding:8px 4px 4px; }
  .order-conf .oc-ic{ font-size:44px; margin-bottom:8px; }
  .order-conf h3{ font-family:'Baloo 2',sans-serif; color:var(--cream); margin:0 0 6px; }
  .order-conf p{ color:var(--cream-dim); font-size:13px; margin:0 0 4px; }
  .order-conf .oid{ font-family:'JetBrains Mono',monospace; color:var(--turmeric-soft); font-size:13px; }
 
  /* ---------- CATEGORY NAV ---------- */
  .nav-wrap{
    position: sticky; top:0; z-index:20;
    padding: 14px 0 16px;
    background: linear-gradient(180deg, var(--base-dark) 72%, rgba(31,18,12,0));
    backdrop-filter: blur(2px);
  }
  .nav-scroll{
    display:flex; gap:10px;
    overflow-x:auto;
    padding: 4px 18px 10px;
    scrollbar-width:none;
  }
  .nav-scroll::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex: 0 0 auto;
    display:flex; align-items:center; gap:8px;
    background: var(--base-dark-2);
    border:1px solid rgba(232,169,59,0.18);
    color: var(--cream-dim);
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding: 11px 18px;
    border-radius: 100px;
    cursor:pointer;
    white-space:nowrap;
    transition: transform .22s ease, background .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease;
    user-select:none;
    -webkit-user-select:none;
  }
  .cat-chip .ic{font-size:16px;}
  .cat-chip:active{transform: scale(0.94);}
  .cat-chip:hover{ border-color: rgba(232,169,59,0.5); color:var(--cream); }
  .cat-chip.active{
    background: linear-gradient(135deg, var(--masala), var(--masala-deep));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 10px 22px -8px rgba(193,68,14,0.65);
    transform: translateY(-2px);
  }
 
  /* ---------- SECTION HEADER ---------- */
  .section-head{
    position:relative; z-index:1;
    padding: 6px 20px 18px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .section-head h2{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(22px, 6vw, 30px);
    margin:0;
    color:var(--cream);
    display:flex; align-items:center; gap:10px;
  }
  .section-head h2 .ic{font-size: 0.85em;}
  .section-head .count{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; color: var(--turmeric-soft);
    letter-spacing:1px;
    white-space:nowrap;
  }
 
  /* ---------- GRID ---------- */
  .grid{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: repeat(1, 1fr);
    gap: 16px;
    padding: 0 20px 60px;
  }
  @media (min-width:560px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width:900px){
    .grid{ grid-template-columns: repeat(3, 1fr); gap:22px; padding:0 40px 70px; }
  }
  @media (min-width:1300px){
    .grid{ max-width:1180px; margin:0 auto; }
  }
 
  .card{
    background: var(--card);
    border-radius: 22px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
    color: var(--card-text);
    opacity:0; transform: translateY(16px) scale(0.97);
    animation: riseIn .5s cubic-bezier(.2,.7,.3,1) forwards;
    transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease, background .5s ease, border-color .5s ease;
    border: 1px solid var(--card-edge);
  }
  .card:hover{ transform: translateY(-6px); box-shadow: 0 22px 40px -14px rgba(31,18,12,0.5); }
  .card:active{ transform: translateY(-2px) scale(0.985); }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0) scale(1);} }
 
  .card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .icon-badge{
    width:58px; height:58px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    background: linear-gradient(150deg, var(--iconA), var(--iconB));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 6px 14px -6px rgba(0,0,0,0.35);
  }
  .best-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase;
    color:#fff; background: var(--masala);
    padding:4px 8px; border-radius:6px;
    transform: rotate(3deg);
    box-shadow: 0 4px 8px -3px rgba(193,68,14,0.6);
  }
  .card h3{
    font-family:'Baloo 2', sans-serif;
    font-size:18.5px; margin: 4px 0 4px;
    color: var(--card-title);
    line-height:1.2;
    transition: color .5s ease;
  }
  .card p.desc{
    font-size:12.5px; color:var(--card-desc); margin:0 0 14px; line-height:1.5; min-height:32px;
    transition: color .5s ease;
  }
  .card .bottom-row{
    /* layout defined above in ADD TO CART BUTTON section */
  }
  .price-tag{
    font-family:'JetBrains Mono',monospace;
    font-weight:700; font-size:16px;
    color: var(--tamarind);
  }
  .price-tag::before{ content:"₹"; font-size:12px; margin-right:1px; opacity:0.75; }
 
  footer{
    text-align:center; padding: 10px 20px 50px;
    color: var(--cream-dim); font-size:12px; position:relative; z-index:1;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.5px;
  }
  footer .flame{color:var(--turmeric-soft);}
 
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="seedfield"></div>
 
<div class="hero">
  <div class="stamp"><span class="dot"></span> STREET-STYLE &nbsp;•&nbsp; SINCE THE FIRST BITE <span class="dot"></span></div>
  <h1 class="brand">WELCOME TO<br><span class="accent">LEGEND OF CHAAT</span></h1>
  <p class="tagline">Every plate is a story — tangy, spicy, crunchy. <b>Tap a category below</b> to explore what's cooking.</p>
  <div class="divider-row"><span class="line"></span><span class="glyph">🌶️</span><span class="line"></span></div>
  <div class="theme-picker">
    <span class="tp-label">Theme</span>
    <div class="swatch active" data-t="spice" title="Spice Market"></div>
    <div class="swatch" data-t="tandoor" title="Midnight Tandoor"></div>
    <div class="swatch" data-t="rajwada" title="Royal Rajwada"></div>
    <div class="swatch" data-t="mint" title="Mint Bazaar"></div>
  </div>
</div>
 
<div class="nav-wrap">
  <div class="nav-scroll" id="navScroll"></div>
</div>
 
<div class="section-head">
  <h2><span class="ic" id="secIcon">🥔</span> <span id="secTitle">Quick Bites</span></h2>
  <span class="count" id="secCount">9 ITEMS</span>
</div>
 
<div class="grid" id="grid"></div>
 
<footer>MADE FRESH • SERVED WITH LOVE <span class="flame">🔥</span> LEGEND OF CHAAT</footer>
 
<button class="cart-fab" id="cartFab">🛒<span class="cart-badge" id="cartBadge" style="display:none">0</span></button>
<div class="overlay" id="overlay"></div>
 
<!-- CART SHEET -->
<div class="sheet" id="cartSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Your Cart <button class="sheet-close" id="closeCart">✕</button></div>
  <div id="cartLines"></div>
  <div id="cartFooter"></div>
</div>
 
<!-- PAYMENT SHEET -->
<div class="sheet" id="paySheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Choose Payment <button class="sheet-close" id="closePay">✕</button></div>
  <div class="pay-options">
    <div class="pay-opt" id="optCash"><div class="pi">💵</div><div class="pn">Cash</div></div>
    <div class="pay-opt" id="optUpi"><div class="pi">📱</div><div class="pn">UPI</div></div>
  </div>
  <div id="payDetail"></div>
</div>
 
<script>
const MENU = {
  "Quick Bites": { icon:"🥔", colors:["#E8A93B","#C1440E"], items:[
    {n:"Aloo Tikki", p:60, d:"Crisp potato patty, tangy chutneys", ic:"🥔"},

const nav = document.getElementById('navScroll');
const grid = document.getElementById('grid');
const secTitle = document.getElementById('secTitle');
const secIcon = document.getElementById('secIcon');
const secCount = document.getElementById('secCount');
 
Object.keys(MENU).forEach(cat=>{
  const chip = document.createElement('button');
  chip.className = 'cat-chip';
  chip.innerHTML = `<span class="ic">${MENU[cat].icon}</span><span>${cat}</span>`;
  chip.addEventListener('click', ()=> selectCategory(cat, chip));
  chip.dataset.cat = cat;
  nav.appendChild(chip);
});
 
function renderGrid(cat){
  const data = MENU[cat];
  grid.innerHTML = '';
  data.items.forEach((item, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--iconA', data.colors[0]);
    card.style.setProperty('--iconB', data.colors[1]);
    card.style.animationDelay = (i*0.045)+'s';
    card.innerHTML = `
      <div class="top-row">
        <div class="icon-badge">${item.ic}</div>
        ${item.best ? '<div class="best-tag">Bestseller</div>' : ''}
      </div>
      <h3>${item.n}</h3>
      <p class="desc">${item.d}</p>
      <div class="bottom-row">
        <span class="price-tag">${item.p}</span>
        <button class="add-cart-btn" data-name="${item.n}" data-price="${item.p}" data-ic="${item.ic}" data-a="${data.colors[0]}" data-b="${data.colors[1]}">🛒 Add</button>
      </div>
    `;
    card.querySelector('.add-cart-btn').addEventListener('click', (e)=>{
      addToCart({ name:item.n, price:item.p, ic:item.ic, a:data.colors[0], b:data.colors[1] });
      const btn = e.currentTarget;
      btn.classList.add('added'); btn.textContent = '✓ Added';
      setTimeout(()=>{ btn.classList.remove('added'); btn.textContent = '🛒 Add'; }, 1000);
    });
    grid.appendChild(card);
  });
  secTitle.textContent = cat;
  secIcon.textContent = data.icon;
  secCount.textContent = data.items.length + ' ITEMS';
}
 
function selectCategory(cat, chipEl){
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
  chipEl.classList.add('active');
  chipEl.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  renderGrid(cat);
}
 
/* ---------------- THEME SWITCHER ---------------- */
document.querySelectorAll('.swatch').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
    const t = sw.dataset.t;
    if(t === 'spice'){ document.body.removeAttribute('data-theme'); }
    else{ document.body.setAttribute('data-theme', t); }
  });
});
 
/* ---------------- CART SYSTEM (frontend state — see chat note on backend) ---------------- */
// ⚠️ NOTE: This cart lives in browser memory only. It resets on page reload and
// is not connected to any server, database, or payment gateway. See the message
// in chat for what a production-ready backend + UPI payment gateway would need.
let cart = []; // {name, price, qty, ic, a, b}
const MERCHANT_VPA = "legendofchaat@upi";   // ⬅ replace with the restaurant's real UPI ID
const MERCHANT_NAME = "Legend of Chaat";
 
const overlay = document.getElementById('overlay');
const cartSheet = document.getElementById('cartSheet');
const paySheet = document.getElementById('paySheet');
const cartFab = document.getElementById('cartFab');
const cartBadge = document.getElementById('cartBadge');
const cartLines = document.getElementById('cartLines');
const cartFooter = document.getElementById('cartFooter');
const payDetail = document.getElementById('payDetail');
 
function addToCart(item){
  const existing = cart.find(c=>c.name === item.name);
  if(existing){ existing.qty += 1; }
  else{ cart.push({...item, qty:1}); }
  updateCartBadge();
}
 
function updateCartBadge(){
  const count = cart.reduce((s,c)=>s+c.qty, 0);
  if(count > 0){ cartBadge.style.display='flex'; cartBadge.textContent = count; }
  else{ cartBadge.style.display='none'; }
}
 
function cartTotal(){
  return cart.reduce((s,c)=> s + c.price*c.qty, 0);
}
 
function openSheet(sheet){
  overlay.classList.add('show');
  sheet.classList.add('show');
}
function closeSheets(){
  overlay.classList.remove('show');
  cartSheet.classList.remove('show');
  paySheet.classList.remove('show');
}
overlay.addEventListener('click', closeSheets);
document.getElementById('closeCart').addEventListener('click', closeSheets);
document.getElementById('closePay').addEventListener('click', closeSheets);
 
function renderCart(){
  if(cart.length === 0){
    cartLines.innerHTML = '<div class="cart-empty">Your cart is empty.<br>Add some chaat to get started! 🌶️</div>';
    cartFooter.innerHTML = '';
    return;
  }
  cartLines.innerHTML = cart.map((c,i)=>`
    <div class="cart-line">
      <div class="ci-ic" style="--iconA:${c.a};--iconB:${c.b}">${c.ic}</div>
      <div class="ci-info">
        <div class="ci-name">${c.name}</div>
        <div class="ci-price">₹${c.price} × ${c.qty} = ₹${c.price*c.qty}</div>
      </div>
      <div class="qty-stepper">
        <button data-act="dec" data-i="${i}">−</button>
        <span>${c.qty}</span>
        <button data-act="inc" data-i="${i}">+</button>
      </div>
    </div>
  `).join('');
  cartFooter.innerHTML = `
    <div class="cart-total-row"><span class="lbl">Total Amount</span><span class="amt">₹${cartTotal()}</span></div>
    <button class="primary-btn" id="proceedPay">Proceed to Payment</button>
  `;
  cartLines.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = +btn.dataset.i;
      if(btn.dataset.act === 'inc'){ cart[i].qty += 1; }
      else{ cart[i].qty -= 1; if(cart[i].qty <= 0) cart.splice(i,1); }
      updateCartBadge();
      renderCart();
    });
  });
  document.getElementById('proceedPay').addEventListener('click', ()=>{
    closeSheets();
    setTimeout(()=>{ openPaySheet(); }, 200);
  });
}
 
cartFab.addEventListener('click', ()=>{
  renderCart();
  closeSheets();
  setTimeout(()=> openSheet(cartSheet), 10);
});
 
function openPaySheet(){
  payDetail.innerHTML = '';
  document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('sel'));
  openSheet(paySheet);
}
 
document.getElementById('optCash').addEventListener('click', ()=>{
  document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('sel'));
  document.getElementById('optCash').classList.add('sel');
  const orderId = 'LOC' + Math.floor(100000 + Math.random()*900000);
  payDetail.innerHTML = `
    <div class="order-conf">
      <div class="oc-ic">💵</div>
      <h3>Pay at the Counter</h3>
      <p>Please pay <b style="color:var(--turmeric-soft)">₹${cartTotal()}</b> in cash when your order is served.</p>
      <p class="oid">Order ID: ${orderId}</p>
    </div>
    <button class="primary-btn" id="confirmCash">Confirm Order</button>
  `;
  document.getElementById('confirmCash').addEventListener('click', ()=>{
    cart = []; updateCartBadge(); closeSheets();
  });
});
 
document.getElementById('optUpi').addEventListener('click', ()=>{
  document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('sel'));
  document.getElementById('optUpi').classList.add('sel');
  const amount = cartTotal();
  const orderId = 'LOC' + Math.floor(100000 + Math.random()*900000);
  const upiString = `upi://pay?pa=${encodeURIComponent(MERCHANT_VPA)}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=${amount}&cu=INR&tn=${encodeURIComponent('Order '+orderId)}`;
  payDetail.innerHTML = `
    <div class="qr-box" id="qrBox"></div>
    <p class="upi-note">Scan with any UPI app to pay <b style="color:var(--turmeric-soft)">₹${amount}</b><br>
    to <code>${MERCHANT_VPA}</code></p>
    <button class="primary-btn" id="confirmUpi">I've Completed Payment</button>
    <p class="upi-note" style="margin-top:10px;opacity:0.75">Order ID: ${orderId}</p>
  `;
  document.getElementById('qrBox').innerHTML = '';
  new QRCode(document.getElementById('qrBox'), {
    text: upiString, width:180, height:180,
    colorDark:"#1F120C", colorLight:"#ffffff"
  });
  document.getElementById('confirmUpi').addEventListener('click', ()=>{
    payDetail.innerHTML = `
      <div class="order-conf">
        <div class="oc-ic">✅</div>
        <h3>Thanks!</h3>
        <p>We've noted your payment for order <b style="color:var(--turmeric-soft)">${orderId}</b>.</p>
        <p style="font-size:11.5px">Please show this screen at the counter — this demo does not verify payment automatically.</p>
      </div>
      <button class="ghost-btn" id="doneUpi">Done</button>
    `;
    document.getElementById('doneUpi').addEventListener('click', ()=>{
      cart = []; updateCartBadge(); closeSheets();
    });
  });
});
 
// init
const first = document.querySelector('.cat-chip');
selectCategory('Quick Bites', first);
</script>
